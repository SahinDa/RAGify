<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAGify — Document Intelligence</title>

    <!-- External Markdown Parser & KaTeX Math Rendering -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"
        onload="renderMathInElement(document.body);"></script>

    <!-- App Stylesheet -->
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>
    <!-- Top Bar Navigation -->
    <header>
        <div class="brand">
            <div class="brand-icon">⚡</div>
            <div>RAG<span>ify</span></div>
        </div>

        <div class="header-actions">
            <!-- Sign In Button (Visible when logged out) -->
            <button class="btn-header btn-primary" id="authBtn" onclick="openAuthModal()">Sign In</button>

            <!-- Profile Dropdown Section (Visible when logged in) -->
            <div class="profile-container" id="profileContainer">
                <button class="profile-trigger" id="profileTrigger" onclick="toggleProfileDropdown(event)">
                    <div class="avatar-circle" id="userAvatar">U</div>
                    <span id="headerUserName">User</span>
                    <span style="font-size: 0.7rem; opacity: 0.6;">▼</span>
                </button>

                <div class="profile-dropdown" id="profileDropdown" onclick="event.stopPropagation()">
                    <div class="dropdown-user-info">
                        <span class="dropdown-email" id="dropdownEmail">user@domain.com</span>
                        <div>
                            <span class="user-role-badge" id="dropdownRoleBadge">USER</span>
                        </div>
                    </div>
                    <button class="dropdown-item danger" onclick="handleLogout()">
                        <span>🚪</span>
                        <span>Sign Out</span>
                    </button>
                </div>
            </div>

            <button class="btn-header" onclick="toggleTheme()">
                <span id="themeIcon">🌙</span>
                <span id="themeLabel">Dark</span>
            </button>
            <button class="btn-header btn-danger" onclick="resetConversation()">Clear Chat</button>
        </div>
    </header>

    <!-- Upload Status Bar -->
    <div class="doc-bar">
        <div class="dropzone-pill" id="dropzone" onclick="handleDropzoneClick()">
            <span id="dropzoneIcon">📄</span>
            <span id="dropzoneText">Drop document here or <strong>browse</strong> (.pdf, .docx, .txt)</span>
            <input type="file" id="fileInput" accept=".txt,.pdf,.docx" onchange="handleSingleFile(this.files[0])" />
        </div>
    </div>

    <!-- Scrollable Chat Canvas -->
    <main id="chat-history">
        <div class="welcome-center" id="welcomeCenter">
            <div class="welcome-icon">💬</div>
            <h2 class="welcome-title">How can I help with your documents?</h2>
            <p class="welcome-desc">Upload documents above and ask questions across all indexed content.</p>
        </div>
    </main>

    <!-- Bottom Query Console -->
    <footer>
        <div class="console-dock">
            <div class="input-row">
                <textarea id="questionInput" class="input-box" rows="1"
                    placeholder="Ask a question across your documents..." oninput="autoResize(this)"
                    onkeydown="handleKey(event)"></textarea>
                <button class="btn-send" id="submitBtn" onclick="submitQuery()">Send</button>
            </div>
            <div class="meta-strip">
                <label class="stream-toggle">
                    <input type="checkbox" id="streamToggle" checked />
                    <span>Token Streaming</span>
                </label>
                <span>Enter to Send, Shift+Enter for newline</span>
            </div>
        </div>
    </footer>

    <!-- Auth Modal Dialog -->
    <div class="modal-overlay" id="authModal" onclick="handleOverlayClick(event)">
        <div class="auth-card" onclick="event.stopPropagation()">
            <div class="auth-header">
                <h2 class="auth-title" id="authModalTitle">Sign In</h2>
                <button class="btn-close" onclick="closeAuthModal()" aria-label="Close dialog">×</button>
            </div>

            <div class="auth-error" id="authError"></div>

            <!-- Sign Up Name Fields -->
            <div id="signupNameFields" style="display: none; gap: 10px; width: 100%; box-sizing: border-box;">
                <div class="auth-field" style="flex: 1; min-width: 0;">
                    <label for="authFirstName">First Name</label>
                    <input class="auth-input" type="text" id="authFirstName" placeholder="John" />
                </div>
                <div class="auth-field" style="flex: 1; min-width: 0;">
                    <label for="authLastName">Last Name</label>
                    <input class="auth-input" type="text" id="authLastName" placeholder="Doe" />
                </div>
            </div>

            <div class="auth-field">
                <label for="authEmail">Email</label>
                <input class="auth-input" type="email" id="authEmail" placeholder="you@domain.com" />
            </div>

            <div class="auth-field">
                <label for="authPassword">Password</label>
                <input class="auth-input" type="password" id="authPassword" placeholder="••••••••" />
            </div>

            <div class="auth-field" id="confirmPasswordField" style="display: none;">
                <label for="authConfirmPassword">Confirm Password</label>
                <input class="auth-input" type="password" id="authConfirmPassword" placeholder="••••••••" />
            </div>

            <button class="btn-send" id="authSubmitBtn" onclick="submitAuth()">Sign In</button>

            <div class="auth-toggle-link" id="authToggleText" onclick="toggleAuthMode()">
                Don't have an account? Sign Up
            </div>
        </div>
    </div>

    <!-- Modular Application Scripts -->
    <script src="/static/js/auth.js"></script>
    <script src="/static/js/upload.js"></script>
    <script src="/static/js/chat.js"></script>
</body>

</html>
