<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAGify - Document Intelligence</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <!-- Markdown & KaTeX Math Support -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
</head>

<body>
    <!-- Top Bar -->
    <header>
        <div class="brand">
            <div class="brand-icon">⚡</div>
            <div>RAG<span>ify</span></div>
        </div>

        <div class="header-actions">
            <!-- Mode Badges & Auth Actions -->
            <div id="demoBadge" class="demo-badge-pill">
                <span class="badge-pulse">
                    <span class="badge-pulse-ring"></span>
                    <span class="badge-dot"></span>
                </span>
                <span class="badge-title">Demo Mode</span>
                <span class="badge-divider"></span>
                <span class="badge-scope">Public</span>
            </div>

            <button type="button" class="btn-header btn-primary" id="authBtn" onclick="openAuthModal()">Sign In</button>

            <!-- Profile Dropdown Section (Hidden by default for guests) -->
            <div class="profile-container" id="profileContainer" style="display: none;">
                <button type="button" class="profile-trigger" id="profileTrigger"
                    onclick="toggleProfileDropdown(event)">
                    <div class="avatar-circle" id="userAvatar"></div>
                    <span id="headerUserName"></span>
                    <span style="font-size: 0.7rem; opacity: 0.6;">▼</span>
                </button>

                <div class="profile-dropdown" id="profileDropdown" onclick="event.stopPropagation()">
                    <div class="dropdown-user-info">
                        <span class="dropdown-email" id="dropdownEmail"></span>
                        <div>
                            <span class="user-role-badge" id="dropdownRoleBadge" style="display: none;"></span>
                        </div>
                    </div>
                    <button type="button" class="dropdown-item danger" onclick="handleLogout(event)">
                        <span>🚪</span>
                        <span>Sign Out</span>
                    </button>
                </div>
            </div>

            <!-- Utilities -->
            <button type="button" class="btn-header" onclick="toggleTheme()">
                <span id="themeIcon">🌙</span>
                <span id="themeLabel">Dark</span>
            </button>
            <button type="button" class="btn-header btn-danger" onclick="resetConversation()">Clear Chat</button>
        </div>
    </header>

    <!-- Document Upload Bar -->
    <div class="doc-bar">
        <div class="dropzone-pill" id="dropzone" onclick="handleDropzoneClick()">
            <input type="file" id="fileInput" accept=".pdf,.docx,.txt" onchange="handleSingleFile(this.files[0])">
            <span id="dropzoneIcon">📄</span>
            <span id="dropzoneText">Drop document here or <strong>browse</strong> (.pdf, .docx, .txt)</span>
        </div>
    </div>

    <!-- Scrollable Chat Workspace -->
    <main id="chat-history">
        <div class="welcome-center" id="welcomeCenter">
            <div class="welcome-icon">💬</div>
            <h2 class="welcome-title">How can I help with your documents?</h2>
            <p class="welcome-desc">Upload documents above and ask questions across all indexed content.</p>
        </div>
    </main>

    <!-- Fixed Bottom Console -->
    <footer>
        <div class="console-dock">
            <div class="input-row">
                <textarea id="questionInput" class="input-box" placeholder="Ask a question about your documents..."
                    rows="1" oninput="autoResize(this)" onkeydown="handleKey(event)"></textarea>
                <button type="button" class="btn-send" id="submitBtn" onclick="submitQuery()">Send</button>
            </div>
            <div class="meta-strip">
                <label class="stream-toggle">
                    <input type="checkbox" id="streamToggle" checked>
                    <span>Stream response</span>
                </label>
                <span>Press Enter to send, Shift+Enter for newline</span>
            </div>
        </div>
    </footer>

    <!-- Auth Modal -->
    <div class="modal-overlay" id="authModal" onclick="handleOverlayClick(event)">
        <div class="auth-card">
            <div class="auth-header">
                <h3 class="auth-title" id="authModalTitle">Sign In</h3>
                <button type="button" class="btn-close" onclick="closeAuthModal()">✕</button>
            </div>

            <div id="authError" class="auth-error"></div>

            <form onsubmit="submitAuth(event)" style="display: flex; flex-direction: column; gap: 12px;">
                <div id="signupNameFields" style="display: none; gap: 10px;">
                    <div class="auth-field" style="flex: 1;">
                        <label for="authFirstName">First Name</label>
                        <input type="text" id="authFirstName" class="auth-input" autocomplete="given-name"
                            onkeydown="handleAuthKey(event)">
                    </div>
                    <div class="auth-field" style="flex: 1;">
                        <label for="authLastName">Last Name</label>
                        <input type="text" id="authLastName" class="auth-input" autocomplete="family-name"
                            onkeydown="handleAuthKey(event)">
                    </div>
                </div>

                <div class="auth-field">
                    <label for="authEmail">Email</label>
                    <input type="email" id="authEmail" class="auth-input" required autocomplete="email"
                        onkeydown="handleAuthKey(event)">
                </div>

                <div class="auth-field">
                    <label for="authPassword">Password</label>
                    <input type="password" id="authPassword" class="auth-input" required autocomplete="current-password"
                        onkeydown="handleAuthKey(event)">
                </div>

                <div class="auth-field" id="confirmPasswordField" style="display: none;">
                    <label for="authConfirmPassword">Confirm Password</label>
                    <input type="password" id="authConfirmPassword" class="auth-input" autocomplete="new-password"
                        onkeydown="handleAuthKey(event)">
                </div>

                <button type="submit" class="btn-send" id="authSubmitBtn" style="margin-top: 6px; width: 100%;">Sign
                    In</button>
            </form>

            <div style="text-align: center; margin-top: 6px;">
                <a href="javascript:void(0)" class="auth-toggle-link" id="authToggleText"
                    onclick="toggleAuthMode()">Don't have an account? Sign Up</a>
            </div>
        </div>
    </div>

    <script src="/static/js/auth.js"></script>
    <script src="/static/js/chat.js"></script>
    <script src="/static/js/upload.js"></script>
</body>

</html>
